<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoCall Pro - Secure Video Calling</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        .auth-container {

        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .auth-form input {
            width: 100%;

            margin: 10px 0;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin: 10px 0;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .error-message {
            color: #e74c3c;
            background: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;

        }

        .success-message {
            color: #27ae60;

        .header {

            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .main-content {

        .users-panel {

        .user-item:hover {

        .call-btn {

        .call-interface {

        }

        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            flex: 1;
            margin-bottom: 20px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;

        }

        .controls {
            display: flex;
            justify-content: center;

        .control-btn {

        .notification {

        .notification-buttons {

        .dialer {

        .dialer-input {

        .call-type-buttons {

        .overlay {
            position: fixed;
            top: 0;

            height: 100%;

        .loading {
            display: none;

        .call-status {

            padding: 8px 15px;

            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
        }
    </style>
</head>

<body>
    <!-- Authentication Screens -->

    <!-- Incoming Call Notification -->
    <div id="incomingCallNotification" class="notification" style="display: none;">

        <div class="notification-buttons">

    <!-- Overlay for notifications -->

    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC4PF__jAZuPBZw6rqheI2gokZW-WtxwDg",
            authDomain: "video-call-1a584.firebaseapp.com",
            projectId: "video-call-1a584",
            storageBucket: "video-call-1a584.firebasestorage.app",
            messagingSenderId: "537253207694",
            appId: "1:537253207694:web:f8222f7a1a4d4c5f16f3df",
        };

        // Initialize Firebase
        let firebaseApp;
        let db;
        let auth;

        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            console.log("Firebase initialized successfully");
        } catch (error) {
            console.error("Firebase initialization error:", error);
            showError("Firebase configuration issue.");
        }

        // Global variables
        let localStream, screenStream, peerConnections = {};
        let currentUser = null;
        let currentCall = null;
        let isInCall = false;
        let isSharingScreen = false;
        let incomingCallData = null;
        let activeCallData = null;
        let userUniqueId = null;
        let signalingUnsubscribe = null;
        let connectionCheckInterval = null;

        // Improved WebRTC Configuration with TURN servers
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ],
            iceCandidatePoolSize: 10,
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require'
        };

        // DOM Elements
        const authScreen = document.getElementById('authScreen');
        const appScreen = document.getElementById('appScreen');
        const usersList = document.getElementById('usersList');
        const videoContainer = document.getElementById('videoContainer');
        const incomingCallNotification = document.getElementById('incomingCallNotification');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const userUniqueIdElement = document.getElementById('userUniqueId');
        const displayUserIdElement = document.getElementById('displayUserId');
        const dialInput = document.getElementById('dialInput');
        const overlay = document.getElementById('overlay');
        const usersLoading = document.getElementById('usersLoading');
        const callStatus = document.getElementById('callStatus');

        // Storage Keys
        const STORAGE_KEYS = {
            USER_SESSION: 'videocall_user_session'
        };

        // App State Management
        const AppState = {
            AUTH: 'auth',
            APP: 'app',
            CALL: 'call'
        };

        let appState = AppState.AUTH;

        // Utility Functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        // WebRTC Data Serialization Functions
        function serializeRTCSessionDescription(desc) {
            return {
                type: desc.type,
                sdp: desc.sdp
            };
        }

        function deserializeRTCSessionDescription(desc) {
            return new RTCSessionDescription(desc);
        }

        function serializeRTCIceCandidate(candidate) {
            return {
                candidate: candidate.candidate,
                sdpMid: candidate.sdpMid,
                sdpMLineIndex: candidate.sdpMLineIndex,
                usernameFragment: candidate.usernameFragment
            };
        }

        function deserializeRTCIceCandidate(candidate) {
            return new RTCIceCandidate(candidate);
        }

        // Local Storage Functions
        function saveToLocalStorage(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
            } catch (error) {
                console.error('Error saving to localStorage:', error);
            }
        }

        function getFromLocalStorage(key) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
            } catch (error) {
                console.error('Error reading from localStorage:', error);
                return null;
            }
        }

        function clearLocalStorage() {
            try {
                localStorage.removeItem(STORAGE_KEYS.USER_SESSION);
            } catch (error) {
                console.error('Error clearing localStorage:', error);
            }
        }

        // Session Management
        function saveUserSession(userData) {
            const sessionData = {
                ...userData,
                timestamp: Date.now()
            };
            saveToLocalStorage(STORAGE_KEYS.USER_SESSION, sessionData);
        }

        function getUserSession() {
            return getFromLocalStorage(STORAGE_KEYS.USER_SESSION);
        }

        function isSessionValid(session) {
            if (!session) return false;
            // Session expires after 24 hours
            return Date.now() - session.timestamp < 24 * 60 * 60 * 1000;
        }

        // Generate 7-digit unique ID
        function generateUniqueId() {
            const timestampPart = Date.now().toString().slice(-4);
            const randomPart = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
            let uniqueId = (timestampPart + randomPart).slice(-7);
            uniqueId = uniqueId.padStart(7, '0');
            console.log("Generated unique ID:", uniqueId);
            return uniqueId;
        }

        // Check if unique ID already exists in the database
        async function isUniqueIdAvailable(uniqueId) {
            try {
                const snapshot = await db.collection('users')
                    .where('uniqueId', '==', uniqueId)
                    .get();
                return snapshot.empty;
            } catch (error) {
                console.error('Error checking unique ID:', error);
                return false;
            }
        }

        // Generate a guaranteed unique ID
        async function generateGuaranteedUniqueId() {
            let attempts = 0;
            const maxAttempts = 10;
            
            while (attempts < maxAttempts) {
                const candidateId = generateUniqueId();
                const isAvailable = await isUniqueIdAvailable(candidateId);
                
                if (isAvailable) {
                    console.log("Found unique ID after", attempts + 1, "attempts:", candidateId);
                    return candidateId;
                }
                
                attempts++;
            }
            
            const fallbackId = Date.now().toString().slice(-7).padStart(7, '0');
            console.log("Using fallback ID:", fallbackId);
            return fallbackId;
        }

        // Update User ID Display
        function updateUserIdDisplay() {
            if (userUniqueId) {
                userUniqueIdElement.textContent = userUniqueId;
                displayUserIdElement.textContent = userUniqueId;
            } else {
                userUniqueIdElement.textContent = "0000000";
                displayUserIdElement.textContent = "0000000";
            }
        }

        // WebRTC Signaling using Firebase Firestore
        function setupSignaling() {
            if (!currentUser || !userUniqueId) {
                console.log("Cannot setup signaling: user not properly initialized");
                return;
            }

            try {
                // Listen for incoming signaling messages
                signalingUnsubscribe = db.collection('signaling')
                    .where('to', '==', userUniqueId)
                    .onSnapshot(
                        snapshot => {
                            snapshot.docChanges().forEach(change => {
                                if (change.type === 'added') {
                                    const message = change.doc.data();
                                    console.log('Received signaling message:', message);
                                    handleSignalingMessage(message);
                                    // Remove the message after processing
                                    setTimeout(() => {
                                        db.collection('signaling').doc(change.doc.id).delete()
                                            .catch(error => console.error("Error deleting signaling message:", error));
                                    }, 1000);
                                }
                            });
                        },
                        error => {
                            console.error("Error in signaling listener:", error);
                        }
                    );
                console.log("Signaling setup completed successfully");
            } catch (error) {
                console.error("Error setting up signaling:", error);
            }
        }

        function sendSignalingMessage(to, type, data) {
            if (!to || !userUniqueId) {
                console.error("Cannot send signaling message: missing parameters");
                return;
            }

            let serializedData;
            
            // Serialize WebRTC objects before storing in Firestore
            if (type === 'offer' || type === 'answer') {
                serializedData = serializeRTCSessionDescription(data);
            } else if (type === 'ice-candidate') {
                serializedData = serializeRTCIceCandidate(data);
            } else {
                serializedData = data;
            }

            const message = {
                from: userUniqueId,
                to: to,
                type: type,
                data: serializedData,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection('signaling').add(message)
                .then(() => console.log(`Signaling message sent: ${type} to ${to}`))
                .catch(error => console.error("Error sending signaling message:", error));
        }

        function handleSignalingMessage(message) {
            console.log('Processing signaling message:', message.type, 'from:', message.from);

            if (!message.from || !message.type) {
                console.error("Invalid signaling message received");
                return;
            }

            let data = message.data;
            
            // Deserialize WebRTC objects
            if (message.type === 'offer' || message.type === 'answer') {
                data = deserializeRTCSessionDescription(data);
            } else if (message.type === 'ice-candidate') {
                data = deserializeRTCIceCandidate(data);
            }

            switch (message.type) {
                case 'offer':
                    handleOffer(message.from, data);
                    break;
                case 'answer':
                    handleAnswer(message.from, data);
                    break;
                case 'ice-candidate':
                    handleIceCandidate(message.from, data);
                    break;
                case 'call-ended':
                    handleRemoteHangup(message.from);
                    break;
                case 'call-request':
                    handleCallRequest(message.from, data);
                    break;
                default:
                    console.log("Unknown signaling message type:", message.type);
            }
        }

        // Improved WebRTC Functions with better error handling
        async function createPeerConnection(targetId, isInitiator = false) {
            if (!targetId) {
                console.error("Cannot create peer connection: missing targetId");
                return;
            }

            try {
                console.log(`Creating peer connection with ${targetId}, initiator: ${isInitiator}`);
                
                const pc = new RTCPeerConnection(rtcConfig);

                // Add local stream tracks if available
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        console.log(`Adding local track: ${track.kind}`);
                        pc.addTrack(track, localStream);
                    });
                }

                // Handle incoming tracks
                pc.ontrack = (event) => {
                    console.log('Received remote stream from:', targetId, event.streams);
                    if (event.streams && event.streams[0]) {
                        addRemoteVideo(targetId, event.streams[0]);
                    }
                };

                // Handle ICE candidates
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('Sending ICE candidate to:', targetId);
                        sendSignalingMessage(targetId, 'ice-candidate', event.candidate);
                    } else {
                        console.log('All ICE candidates have been sent to:', targetId);
                    }
                };

                // Handle connection state changes
                pc.onconnectionstatechange = () => {
                    const state = pc.connectionState;
                    console.log(`Connection state with ${targetId}: ${state}`);
                    updateCallStatus(state);
                    
                    if (state === 'connected') {
                        showSuccess('Call connected successfully!');
                        startConnectionMonitoring(pc, targetId);
                    } else if (state === 'failed' || state === 'disconnected') {
                        console.error(`Connection ${state} with ${targetId}`);
                        if (isInitiator) {
                            // Try to reconnect if we're the initiator
                            setTimeout(() => {
                                if (pc.connectionState === 'failed') {
                                    console.log('Attempting to restart ICE for:', targetId);
                                    pc.restartIce();
                                }
                            }, 2000);
                        }
                    }
                };

                // Handle ICE connection state
                pc.oniceconnectionstatechange = () => {
                    console.log(`ICE connection state with ${targetId}: ${pc.iceConnectionState}`);
                };

                peerConnections[targetId] = pc;

                return pc;
            } catch (error) {
                console.error("Error creating peer connection:", error);
                return null;
            }
        }

        async function handleOffer(from, offer) {
            console.log('Handling offer from:', from);
            
            if (isInCall && activeCallData && activeCallData.from !== from) {
                console.log('Already in call, rejecting incoming offer');
                sendSignalingMessage(from, 'call-ended', { reason: 'busy' });
                return;
            }

            // Show incoming call notification
            incomingCallData = {
                from: from,
                type: 'video', // You can detect this from offer SDP
                id: 'incoming-' + Date.now()
            };
            
            document.getElementById('callerInfo').textContent = 
                `User ${from} is video calling you...`;
            incomingCallNotification.style.display = 'block';
            overlay.style.display = 'block';
            
            // Store the offer for later use if accepted
            incomingCallData.offer = offer;
        }

        async function handleAnswer(from, answer) {
            console.log('Handling answer from:', from);
            
            const pc = peerConnections[from];
            if (pc && pc.signalingState !== 'stable') {
                try {
                    await pc.setRemoteDescription(answer);
                    console.log('Remote description set successfully for:', from);
                } catch (error) {
                    console.error('Error handling answer:', error);
                }
            }
        }

        async function handleIceCandidate(from, candidate) {
            console.log('Handling ICE candidate from:', from);
            
            const pc = peerConnections[from];
            if (pc) {
                try {
                    await pc.addIceCandidate(candidate);
                    console.log('ICE candidate added successfully for:', from);
                } catch (error) {
                    console.error('Error adding ICE candidate:', error);
                    // Don't show error for failed ICE candidates - they're common
                }
            }
        }

        function handleCallRequest(from, data) {
            console.log('Received call request from:', from);
            // This can be used for future call request handling
        }

        function handleRemoteHangup(from) {
            console.log('Remote user hung up:', from);
            showSuccess('Call ended by remote user');
            removePeerConnection(from);
            if (Object.keys(peerConnections).length === 0) {
                hangUp();
            }
        }

        function removePeerConnection(targetId) {
            if (peerConnections[targetId]) {
                peerConnections[targetId].close();
                delete peerConnections[targetId];
            }
            
            // Remove remote video
            const remoteVideo = document.getElementById(`remote-wrapper-${targetId}`);
            if (remoteVideo) {
                remoteVideo.remove();
            }
        }

        function updateCallStatus(status) {
            const statusMap = {
                'new': 'Ready',
                'connecting': 'Connecting...',
                'connected': 'Connected',
                'disconnected': 'Disconnected',
                'failed': 'Connection Failed - Check your network',
                'closed': 'Call Ended'
            };
            
            callStatus.textContent = statusMap[status] || status;
            
            // Update status color based on connection state
            if (status === 'connected') {
                callStatus.style.background = '#d4edda';
                callStatus.style.color = '#155724';
            } else if (status === 'failed' || status === 'disconnected') {
                callStatus.style.background = '#f8d7da';
                callStatus.style.color = '#721c24';
            } else {
                callStatus.style.background = '#fff3cd';
                callStatus.style.color = '#856404';
            }
        }

        function startConnectionMonitoring(pc, targetId) {
            // Monitor connection quality
            if (connectionCheckInterval) {
                clearInterval(connectionCheckInterval);
            }
            
            connectionCheckInterval = setInterval(() => {
                if (pc.connectionState === 'connected') {
                    updateConnectionQuality(pc, targetId);
                } else {
                    clearInterval(connectionCheckInterval);
                }
            }, 5000);
        }

        function updateConnectionQuality(pc, targetId) {
            // This is a simplified connection quality indicator
            // In a real app, you'd use RTCPeerConnection.getStats()
            const qualityElement = document.getElementById(`connection-quality-${targetId}`) || 
                                 document.getElementById('localConnectionQuality');
            if (qualityElement) {
                const states = ['Poor', 'Fair', 'Good', 'Excellent'];
                const randomQuality = states[Math.floor(Math.random() * states.length)];
                qualityElement.textContent = randomQuality;
            }
        }

        // Authentication Functions
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            hideMessages();
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            hideMessages();
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            if (!username || !email || !password) {
                showError('Please fill in all fields');
                return;
            }

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Generate guaranteed unique 7-digit ID
                userUniqueId = await generateGuaranteedUniqueId();

                await db.collection('users').doc(user.uid).set({
                    username: username,
                    email: email,
                    uniqueId: userUniqueId,
                    online: true,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                currentUser = {
                    uid: user.uid,
                    username: username,
                    email: email,
                    uniqueId: userUniqueId
                };

                // Save session
                saveUserSession(currentUser);

                showApp();
                showSuccess('Registration successful! Your ID: ' + userUniqueId);
            } catch (error) {
                console.error('Registration error:', error);
                if (error.code === 'auth/email-already-in-use') {
                    showError('Email already registered.');
                } else if (error.code === 'auth/weak-password') {
                    showError('Password is too weak.');
                } else {
                    showError('Registration failed: ' + error.message);
                }
            }
        }

        async function login() {
            const email = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    showError('User not found.');
                    return;
                }

                const userData = userDoc.data();
                
                if (!userData.uniqueId) {
                    console.log("User doesn't have uniqueId, generating one...");
                    userUniqueId = await generateGuaranteedUniqueId();
                    await db.collection('users').doc(user.uid).update({
                        uniqueId: userUniqueId
                    });
                } else {
                    userUniqueId = userData.uniqueId;
                }

                currentUser = {
                    uid: user.uid,
                    username: userData.username,
                    email: user.email,
                    uniqueId: userUniqueId
                };

                // Save session
                saveUserSession(currentUser);

                // Update user status to online
                await db.collection('users').doc(user.uid).update({
                    online: true,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });

                showApp();
                showSuccess('Login successful! Your ID: ' + userUniqueId);
            } catch (error) {
                console.error('Login error:', error);
                if (error.code === 'auth/user-not-found') {
                    showError('User not found.');
                } else if (error.code === 'auth/wrong-password') {
                    showError('Incorrect password.');
                } else {
                    showError('Login failed: ' + error.message);
                }
            }
        }

        function logout() {
            if (currentUser && currentUser.uid) {
                db.collection('users').doc(currentUser.uid).update({
                    online: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(error => console.error("Error updating user status on logout:", error));
            }

            if (signalingUnsubscribe) {
                signalingUnsubscribe();
            }

            if (connectionCheckInterval) {
                clearInterval(connectionCheckInterval);
            }

            // Close all peer connections
            Object.keys(peerConnections).forEach(targetId => {
                removePeerConnection(targetId);
            });

            // Stop local stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            auth.signOut();
            clearLocalStorage();
            currentUser = null;
            userUniqueId = null;
            authScreen.style.display = 'flex';
            appScreen.style.display = 'none';
            hideMessages();
            appState = AppState.AUTH;
        }

        function showApp() {
            authScreen.style.display = 'none';
            appScreen.style.display = 'block';
            
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.username;
                document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();
            }
            
            // Update user ID display
            updateUserIdDisplay();

            initializeApp();
            appState = AppState.APP;
        }

        // Initialize main application
        async function initializeApp() {
            console.log("Initializing app with user:", currentUser);
            console.log("User unique ID:", userUniqueId);
            
            // Wait for user data to be properly loaded
            if (!userUniqueId && currentUser && currentUser.uid) {
                console.log("User ID not available, fetching from database...");
                try {
                    const userDoc = await db.collection('users').doc(currentUser.uid).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        userUniqueId = userData.uniqueId;
                        currentUser.uniqueId = userUniqueId;
                        updateUserIdDisplay();
                        console.log("User ID loaded from database:", userUniqueId);
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                }
            }
            
            await startLocalStream();
            setupSignaling();
            setupUsersListener();
        }

        // Setup users listener
        function setupUsersListener() {
            if (!userUniqueId) {
                console.error("Cannot setup users listener: userUniqueId is null");
                setTimeout(() => {
                    if (userUniqueId) {
                        setupUsersListener();
                    }
                }, 1000);
                return;
            }

            usersLoading.style.display = 'block';
            
            db.collection('users').where('online', '==', true)
                .onSnapshot(
                    snapshot => {
                        usersList.innerHTML = '';
                        usersLoading.style.display = 'none';
                        
                        snapshot.forEach(doc => {
                            const user = doc.data();
                            if (user.uniqueId !== userUniqueId) {
                                const userItem = document.createElement('div');
                                userItem.className = 'user-item online';
                                userItem.innerHTML = `
                                    <div class="avatar">${user.username.charAt(0).toUpperCase()}</div>
                                    <div>
                                        <div>${user.username}</div>
                                        <small>ID: ${user.uniqueId}</small>
                                    </div>
                                    <div class="call-actions">
                                        <button class="call-btn video-call" onclick="initiateUserCall('${user.uniqueId}', 'video')">
                                            <i class="fas fa-video"></i>
                                        </button>
                                        <button class="call-btn audio-call" onclick="initiateUserCall('${user.uniqueId}', 'audio')">
                                            <i class="fas fa-phone"></i>
                                        </button>
                                    </div>
                                `;
                                usersList.appendChild(userItem);
                            }
                        });
                    },
                    error => {
                        console.error("Error in users listener:", error);
                        usersLoading.style.display = 'none';
                    }
                );
        }

        // Media stream function
        async function startLocalStream() {
            try {
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                console.log("Local stream started successfully");
            } catch (error) {
                console.error('Error accessing media devices:', error);
                showError('Camera and microphone access is required for video calls.');
            }
        }

        // Call initiation functions
        function validateAndCall() {
            const targetId = dialInput.value.trim();
            if (targetId.length !== 7) {
                showError('Please enter a valid 7-digit ID');
                return;
            }
            if (targetId === userUniqueId) {
                showError('Cannot call yourself');
                return;
            }
            initiateCall('video', targetId);
        }

        function initiateUserCall(targetId, callType) {
            initiateCall(callType, targetId);
        }

        async function initiateCall(callType, targetId = null) {
            if (!targetId) {
                targetId = dialInput.value.trim();
                if (targetId.length !== 7) {
                    showError('Please enter a valid 7-digit ID');
                    return;
                }
            }

            if (!userUniqueId) {
                showError('Your user ID is not set. Please try logging in again.');
                return;
            }

            if (isInCall) {
                showError('You are already in a call. Please hang up first.');
                return;
            }

            try {
                // Check if target user exists
                const usersSnapshot = await db.collection('users')
                    .where('uniqueId', '==', targetId)
                    .get();

                if (usersSnapshot.empty) {
                    showError('User not found with this ID');
                    return;
                }

                const targetUser = usersSnapshot.docs[0].data();
                showSuccess(`Calling ${targetUser.username}...`);

                // Setup WebRTC connection
                const pc = await createPeerConnection(targetId, true);
                if (!pc) {
                    showError('Failed to create connection');
                    return;
                }

                // Create and send offer
                try {
                    const offer = await pc.createOffer({
                        offerToReceiveAudio: true,
                        offerToReceiveVideo: callType === 'video'
                    });
                    await pc.setLocalDescription(offer);
                    sendSignalingMessage(targetId, 'offer', offer);
                    
                    currentCall = targetId;
                    isInCall = true;
                    showCallInterface();
                    
                    console.log('Offer created and sent to:', targetId);
                } catch (error) {
                    console.error('Error creating offer:', error);
                    showError('Failed to start call');
                    removePeerConnection(targetId);
                }

            } catch (error) {
                console.error('Call initiation error:', error);
                showError('Failed to initiate call');
            }
        }

        // Call management functions
        async function acceptCall() {
            if (!incomingCallData || !incomingCallData.offer) {
                showError('No incoming call to accept');
                return;
            }

            try {
                incomingCallNotification.style.display = 'none';
                overlay.style.display = 'none';
                
                const pc = await createPeerConnection(incomingCallData.from, false);
                if (!pc) {
                    showError('Failed to create connection');
                    return;
                }

                await pc.setRemoteDescription(incomingCallData.offer);
                
                // Create and send answer
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                sendSignalingMessage(incomingCallData.from, 'answer', answer);
                
                isInCall = true;
                activeCallData = incomingCallData;
                showCallInterface();
                showSuccess('Call accepted!');
                
                console.log('Call accepted with:', incomingCallData.from);
                
            } catch (error) {
                console.error('Error accepting call:', error);
                showError('Failed to accept call');
            } finally {
                incomingCallData = null;
            }
        }

        function rejectCall() {
            if (!incomingCallData) return;

            sendSignalingMessage(incomingCallData.from, 'call-ended', { reason: 'rejected' });
            incomingCallNotification.style.display = 'none';
            overlay.style.display = 'none';
            incomingCallData = null;
            showSuccess('Call declined');
        }

        function addRemoteVideo(peerId, stream, username = 'Remote User') {
            // Remove existing remote video if present
            const existingVideo = document.getElementById(`remote-wrapper-${peerId}`);
            if (existingVideo) {
                existingVideo.remove();
            }

            const videoWrapper = document.createElement('div');
            videoWrapper.className = 'video-wrapper remote';
            videoWrapper.id = `remote-wrapper-${peerId}`;

            const video = document.createElement('video');
            video.id = `remote-${peerId}`;
            video.autoplay = true;
            video.playsinline = true;
            video.srcObject = stream;

            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = username || `User ${peerId}`;

            const quality = document.createElement('div');
            quality.className = 'connection-quality';
            quality.id = `connection-quality-${peerId}`;
            quality.textContent = 'Connecting...';

            videoWrapper.appendChild(video);
            videoWrapper.appendChild(label);
            videoWrapper.appendChild(quality);
            videoContainer.appendChild(videoWrapper);
            
            console.log('Remote video added for:', peerId);
        }

        function hangUp() {
            console.log('Hanging up call');
            
            // Send call-ended signal to all peers
            Object.keys(peerConnections).forEach(targetId => {
                sendSignalingMessage(targetId, 'call-ended', {});
                removePeerConnection(targetId);
            });

            if (connectionCheckInterval) {
                clearInterval(connectionCheckInterval);
            }

            isInCall = false;
            currentCall = null;
            activeCallData = null;
            hideCallInterface();

            showSuccess('Call ended');
        }

        function showCallInterface() {
            document.querySelector('.call-interface').style.display = 'flex';
            updateCallStatus('connecting');
        }

        function hideCallInterface() {
            document.querySelector('.call-interface').style.display = 'none';
            updateCallStatus('Ready to call');
        }

        function toggleMic() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                const btn = document.getElementById('micBtn');
                btn.classList.toggle('active', !audioTrack.enabled);
                btn.innerHTML = audioTrack.enabled ?
                    '<i class="fas fa-microphone"></i>' :
                    '<i class="fas fa-microphone-slash"></i>';
            }
        }

        function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                const btn = document.getElementById('videoBtn');
                btn.classList.toggle('active', !videoTrack.enabled);
                btn.innerHTML = videoTrack.enabled ?
                    '<i class="fas fa-video"></i>' :
                    '<i class="fas fa-video-slash"></i>';
            }
        }

        async function toggleScreenShare() {
            if (!isSharingScreen) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: 'always' },
                        audio: true
                    });
                    isSharingScreen = true;
                    document.getElementById('screenShareBtn').classList.add('active');
                    
                    // Replace video track in all peer connections
                    const videoTrack = screenStream.getVideoTracks()[0];
                    Object.values(peerConnections).forEach(pc => {
                        const sender = pc.getSenders().find(s => 
                            s.track && s.track.kind === 'video'
                        );
                        if (sender) {
                            sender.replaceTrack(videoTrack);
                        }
                    });

                    screenStream.getTracks()[0].onended = stopScreenShare;
                    showSuccess('Screen sharing started');
                } catch (error) {
                    console.error('Screen share error:', error);
                    showError('Failed to start screen sharing');
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
            }
            isSharingScreen = false;
            document.getElementById('screenShareBtn').classList.remove('active');
            
            // Switch back to camera
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                Object.values(peerConnections).forEach(pc => {
                    const sender = pc.getSenders().find(s => 
                        s.track && s.track.kind === 'video'
                    );
                    if (sender && videoTrack) {
                        sender.replaceTrack(videoTrack);
                    }
                });
            }
            showSuccess('Screen sharing stopped');
        }

        function copyUserId() {
            if (!userUniqueId) {
                showError('User ID not available');
                return;
            }
            navigator.clipboard.writeText(userUniqueId).then(() => {
                showSuccess('User ID copied to clipboard!');
            }).catch(() => {
                showError('Failed to copy user ID');
            });
        }

        // Initialize auth state listener and check for existing session
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log("Firebase auth state changed: user signed in", user.uid);
                db.collection('users').doc(user.uid).get().then((doc) => {
                    if (doc.exists) {
                        const userData = doc.data();
                        
                        if (!userData.uniqueId) {
                            console.log("User doesn't have uniqueId, generating one...");
                            generateGuaranteedUniqueId().then(newUniqueId => {
                                userUniqueId = newUniqueId;
                                return db.collection('users').doc(user.uid).update({
                                    uniqueId: userUniqueId
                                });
                            }).then(() => {
                                currentUser = {
                                    uid: user.uid,
                                    username: userData.username,
                                    email: user.email,
                                    uniqueId: userUniqueId
                                };
                                saveUserSession(currentUser);
                                showApp();
                            }).catch(error => {
                                console.error("Error generating unique ID:", error);
                            });
                        } else {
                            userUniqueId = userData.uniqueId;
                            currentUser = {
                                uid: user.uid,
                                username: userData.username,
                                email: user.email,
                                uniqueId: userUniqueId
                            };
                            saveUserSession(currentUser);
                            showApp();
                        }
                    } else {
                        console.error("User document not found in Firestore");
                        logout();
                    }
                }).catch(error => {
                    console.error("Error getting user document:", error);
                    logout();
                });
            } else {
                console.log("Firebase auth state changed: user signed out");
                // Check for existing session in localStorage
                const session = getUserSession();
                if (isSessionValid(session)) {
                    currentUser = session;
                    userUniqueId = session.uniqueId;
                    showApp();
                    showSuccess('Welcome back! Your ID: ' + userUniqueId);
                }
            }
        });

        // Initialize app on load
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded, checking for existing session");
            const session = getUserSession();
            if (isSessionValid(session)) {
                currentUser = session;
                userUniqueId = session.uniqueId;
                showApp();
            }
        });
    </script>
</body>
