<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoCall Pro - Enterprise Video Calling</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd8;
            --success: #28a745;
            --danger: #e74c3c;
            --warning: #f39c12;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Authentication Styles */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-form input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: var(--success);
        }

        .btn-danger {
            background: var(--danger);
        }

        /* Application Styles */
        .app-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--light);
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Video Grid Styles */
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
            overflow: auto;
            align-content: start;
        }

        .video-participant {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
            transition: all 0.3s ease;
        }

        .video-participant video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .participant-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .participant-name {
            font-weight: bold;
        }

        .connection-quality {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
        }

        .quality-excellent { background: var(--success); }
        .quality-good { background: #17a2b8; }
        .quality-fair { background: var(--warning); }
        .quality-poor { background: var(--danger); }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: var(--light);
            flex-wrap: wrap;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #6c757d;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn.active {
            background: var(--primary);
        }

        .control-btn.end-call {
            background: var(--danger);
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--light);
            border-left: 1px solid #e9ecef;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .participants-list {
            margin-bottom: 20px;
        }

        .participant-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: white;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 350px;
            animation: slideIn 0.3s ease-out;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }
        .toast.info { border-left: 4px solid #17a2b8; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Stats Panel */
        .stats-panel {
            background: var(--dark);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .modal-buttons .btn {
            width: auto;
            padding: 10px 20px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .app-container { height: calc(100vh - 20px); border-radius: 15px; }
            .main-content { flex-direction: column; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid #e9ecef; }
            .video-grid { grid-template-columns: 1fr; padding: 10px; }
            .controls { gap: 10px; padding: 15px; }
            .control-btn { width: 50px; height: 50px; font-size: 16px; }
            .modal-content { padding: 20px; }
        }

        /* Loading States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Authentication Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="logo">
                <i class="fas fa-video"></i> VideoCall Pro
            </div>
            <div id="authForms">
                <!-- Login/Register forms will be injected here -->
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="appScreen" class="container" style="display: none;">
        <div class="app-container">
            <div class="header">
                <div class="logo">
                    <i class="fas fa-video"></i> VideoCall Pro
                </div>
                <div class="user-info">
                    <div class="avatar" id="userAvatar">U</div>
                    <div>
                        <div id="userName">User</div>
                        <small>ID: <span id="userUniqueId">0000000</span></small>
                    </div>
                    <button class="control-btn" onclick="app.logout()" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="main-content">
                <!-- Video Grid -->
                <div class="video-grid" id="videoGrid">
                    <!-- Video participants will be added here dynamically -->
                </div>

                <!-- Sidebar -->
                <div class="sidebar">
                    <div class="user-id-display">
                        <h4>Your Connection ID</h4>
                        <div class="participant-item">
                            <div class="avatar" id="displayUserAvatar">U</div>
                            <div style="flex: 1;">
                                <div id="displayUserName">User</div>
                                <div class="user-id-section">
                                    <code id="displayUserId">0000000</code>
                                </div>
                            </div>
                            <button class="control-btn" onclick="app.copyUserId()" title="Copy ID">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="participants-list">
                        <h4>Online Participants</h4>
                        <div id="participantsList">
                            <!-- Participants will be populated here -->
                        </div>
                    </div>

                    <div class="stats-panel">
                        <h4>Connection Stats</h4>
                        <div id="connectionStats">
                            <!-- Stats will be populated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="control-btn" id="micBtn" onclick="app.toggleMic()" title="Microphone">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="control-btn" id="videoBtn" onclick="app.toggleVideo()" title="Camera">
                    <i class="fas fa-video"></i>
                </button>
                <button class="control-btn" id="screenShareBtn" onclick="app.toggleScreenShare()" title="Share Screen">
                    <i class="fas fa-desktop"></i>
                </button>
                <button class="control-btn" id="statsBtn" onclick="app.toggleStats()" title="Show Stats">
                    <i class="fas fa-chart-bar"></i>
                </button>
                <button class="control-btn end-call" onclick="app.hangUp()" title="End Call">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incomingCallModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Incoming Call</h3>
            <p id="callerInfo">User is calling you...</p>
            <div class="modal-buttons">
                <button class="btn btn-success" onclick="app.acceptCall()">
                    <i class="fas fa-phone"></i> Accept
                </button>
                <button class="btn btn-danger" onclick="app.rejectCall()">
                    <i class="fas fa-phone-slash"></i> Decline
                </button>
            </div>
        </div>
    </div>

    <!-- Dialer Modal -->
    <div id="dialerModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Start a Call</h3>
            <input type="text" id="dialInput" placeholder="Enter Participant ID" maxlength="7">
            <div class="modal-buttons">
                <button class="btn btn-success" onclick="app.initiateCall('video')">
                    <i class="fas fa-video"></i> Video Call
                </button>
                <button class="btn" onclick="app.initiateCall('audio')">
                    <i class="fas fa-phone"></i> Audio Call
                </button>
                <button class="btn btn-secondary" onclick="app.closeDialer()">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" style="display: none;"></div>

    <script>
        // Enhanced WebRTC Configuration with multiple STUN/TURN servers
        const RTC_CONFIG = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            iceCandidatePoolSize: 10,
            bundlePolicy: 'max-bundle',
            rtcpMuxPolicy: 'require',
            iceTransportPolicy: 'all'
        };

        // Application State
        class WebRTCApp {
            constructor() {
                this.localStream = null;
                this.screenStream = null;
                this.peerConnections = new Map();
                this.dataChannels = new Map();
                this.currentUser = null;
                this.userUniqueId = null;
                this.isInCall = false;
                this.isSharingScreen = false;
                this.incomingCallData = null;
                this.statsInterval = null;
                this.signaling = new SignalingService();
                this.observability = new Observability();
                
                this.initializeApp();
            }

            async initializeApp() {
                await this.loadAuthTemplates();
                this.setupEventListeners();
                this.observability.initialize();
                
                // Check for existing session
                const session = this.getUserSession();
                if (this.isSessionValid(session)) {
                    await this.restoreSession(session);
                }
            }

            async loadAuthTemplates() {
                const authForms = document.getElementById('authForms');
                authForms.innerHTML = `
                    <div id="loginForm">
                        <h2>Welcome Back</h2>
                        <input type="email" id="loginEmail" placeholder="Email" required>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <button class="btn btn-primary" onclick="app.login()">
                            <i class="fas fa-sign-in-alt"></i> Sign In
                        </button>
                        <button class="btn btn-secondary" onclick="app.showRegister()">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>
                    </div>
                    <div id="registerForm" style="display: none;">
                        <h2>Create Account</h2>
                        <input type="text" id="registerUsername" placeholder="Username" required>
                        <input type="email" id="registerEmail" placeholder="Email" required>
                        <input type="password" id="registerPassword" placeholder="Password" required>
                        <button class="btn btn-primary" onclick="app.register()">
                            <i class="fas fa-user-plus"></i> Sign Up
                        </button>
                        <button class="btn btn-secondary" onclick="app.showLogin()">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </button>
                    </div>
                `;
            }

            setupEventListeners() {
                // Global keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch(e.key) {
                            case 'd': e.preventDefault(); this.toggleDialer(); break;
                            case 'm': e.preventDefault(); this.toggleMic(); break;
                            case 'v': e.preventDefault(); this.toggleVideo(); break;
                            case 's': e.preventDefault(); this.toggleScreenShare(); break;
                        }
                    }
                    
                    if (e.key === 'Escape') {
                        this.hangUp();
                    }
                });

                // Window visibility change
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.observability.log('APP', 'Window hidden');
                    } else {
                        this.observability.log('APP', 'Window visible');
                    }
                });

                // Online/offline detection
                window.addEventListener('online', () => {
                    this.showToast('Connection restored', 'success');
                    this.observability.log('NETWORK', 'Online');
                });

                window.addEventListener('offline', () => {
                    this.showToast('Connection lost', 'error');
                    this.observability.log('NETWORK', 'Offline');
                });
            }

            // Authentication Methods
            showLogin() {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            }

            showRegister() {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            }

            async register() {
                const username = document.getElementById('registerUsername').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;

                if (!this.validateAuthInput(username, email, password)) {
                    return;
                }

                try {
                    this.showToast('Creating account...', 'info');
                    
                    // In a real app, you'd call your backend API
                    await this.simulateRegistration(username, email, password);
                    
                    this.showToast('Account created successfully!', 'success');
                    this.showLogin();
                    
                } catch (error) {
                    this.showToast(`Registration failed: ${error.message}`, 'error');
                    this.observability.error('AUTH', 'Registration failed', error);
                }
            }

            async login() {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    this.showToast('Please enter both email and password', 'error');
                    return;
                }

                try {
                    this.showToast('Signing in...', 'info');
                    
                    // Simulate login - replace with actual authentication
                    await this.simulateLogin(email, password);
                    
                    this.userUniqueId = this.generateUniqueId();
                    this.currentUser = {
                        username: email.split('@')[0],
                        email: email,
                        uniqueId: this.userUniqueId
                    };

                    this.saveUserSession(this.currentUser);
                    this.showApp();
                    this.showToast(`Welcome back! Your ID: ${this.userUniqueId}`, 'success');
                    
                } catch (error) {
                    this.showToast(`Login failed: ${error.message}`, 'error');
                    this.observability.error('AUTH', 'Login failed', error);
                }
            }

            logout() {
                this.showToast('Signing out...', 'info');
                
                // Clean up resources
                this.hangUp();
                this.stopLocalStream();
                this.signaling.disconnect();
                
                // Clear session
                this.clearUserSession();
                this.currentUser = null;
                this.userUniqueId = null;
                
                // Show auth screen
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
                
                setTimeout(() => {
                    this.showToast('Successfully signed out', 'success');
                }, 500);
            }

            // WebRTC Methods - IMPLEMENTED MISSING METHODS
            async startLocalStream() {
                try {
                    const constraints = {
                        video: {
                            width: { ideal: 1280, min: 640 },
                            height: { ideal: 720, min: 480 },
                            frameRate: { ideal: 30, min: 15 },
                            facingMode: 'user'
                        },
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            channelCount: 1
                        }
                    };

                    this.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.addLocalVideo();
                    this.observability.log('MEDIA', 'Local stream started');
                    
                } catch (error) {
                    this.observability.error('MEDIA', 'Failed to start local stream', error);
                    this.showToast('Failed to access camera/microphone', 'error');
                    
                    // Try audio only as fallback
                    try {
                        this.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        this.showToast('Video unavailable, audio only mode', 'warning');
                    } catch (audioError) {
                        this.observability.error('MEDIA', 'Audio fallback failed', audioError);
                    }
                }
            }

            addLocalVideo() {
                const videoGrid = document.getElementById('videoGrid');
                
                // Remove existing local video if present
                const existingLocal = videoGrid.querySelector('.video-participant.local');
                if (existingLocal) {
                    existingLocal.remove();
                }

                const localParticipant = document.createElement('div');
                localParticipant.className = 'video-participant local';
                localParticipant.innerHTML = `
                    <video id="localVideo" autoplay playsinline muted></video>
                    <div class="participant-info">
                        <div class="participant-name">You (Local)</div>
                        <div class="connection-quality quality-excellent" id="localConnectionQuality">Excellent</div>
                    </div>
                `;

                videoGrid.appendChild(localParticipant);
                
                // Set the video source
                const localVideo = document.getElementById('localVideo');
                if (localVideo && this.localStream) {
                    localVideo.srcObject = this.localStream;
                }
            }

            stopLocalStream() {
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                    this.localStream = null;
                }
                
                if (this.screenStream) {
                    this.screenStream.getTracks().forEach(track => track.stop());
                    this.screenStream = null;
                }
            }

            async createPeerConnection(targetId, isInitiator = false) {
                try {
                    const pc = new RTCPeerConnection(RTC_CONFIG);
                    
                    // Add local tracks
                    if (this.localStream) {
                        this.localStream.getTracks().forEach(track => {
                            pc.addTrack(track, this.localStream);
                        });
                    }

                    // Set up event handlers
                    pc.ontrack = (event) => this.handleRemoteTrack(targetId, event);
                    pc.onicecandidate = (event) => this.handleIceCandidate(targetId, event);
                    pc.onconnectionstatechange = () => this.handleConnectionStateChange(targetId, pc);
                    pc.oniceconnectionstatechange = () => this.handleIceConnectionStateChange(targetId, pc);
                    pc.onsignalingstatechange = () => this.observability.log('RTC', `Signaling state for ${targetId}: ${pc.signalingState}`);
                    
                    // Create data channel for messaging
                    if (isInitiator) {
                        const dc = pc.createDataChannel('chat', { ordered: true });
                        this.setupDataChannel(targetId, dc);
                    } else {
                        pc.ondatachannel = (event) => {
                            this.setupDataChannel(targetId, event.channel);
                        };
                    }

                    this.peerConnections.set(targetId, pc);
                    this.observability.log('RTC', `Peer connection created for ${targetId}`);
                    
                    return pc;
                    
                } catch (error) {
                    this.observability.error('RTC', 'Failed to create peer connection', error);
                    throw error;
                }
            }

            handleRemoteTrack(targetId, event) {
                console.log('Received remote track from:', targetId, event.streams);
                if (event.streams && event.streams[0]) {
                    this.addRemoteVideo(targetId, event.streams[0]);
                }
            }

            handleIceCandidate(targetId, event) {
                if (event.candidate) {
                    console.log('Sending ICE candidate to:', targetId);
                    this.signaling.sendIceCandidate(targetId, event.candidate);
                }
            }

            handleConnectionStateChange(targetId, pc) {
                const state = pc.connectionState;
                console.log(`Connection state with ${targetId}: ${state}`);
                this.updateCallStatus(state);
                
                if (state === 'connected') {
                    this.showToast('Call connected successfully!', 'success');
                    this.startConnectionMonitoring(pc, targetId);
                } else if (state === 'failed' || state === 'disconnected') {
                    console.error(`Connection ${state} with ${targetId}`);
                    if (pc.connectionState === 'failed') {
                        setTimeout(() => {
                            if (pc.connectionState === 'failed') {
                                console.log('Attempting to restart ICE for:', targetId);
                                pc.restartIce();
                            }
                        }, 2000);
                    }
                }
            }

            handleIceConnectionStateChange(targetId, pc) {
                console.log(`ICE connection state with ${targetId}: ${pc.iceConnectionState}`);
            }

            setupDataChannel(targetId, channel) {
                channel.onopen = () => {
                    console.log(`Data channel with ${targetId} opened`);
                    this.showToast(`Data channel with ${targetId} connected`, 'info');
                };
                
                channel.onmessage = (event) => {
                    console.log(`Message from ${targetId}:`, event.data);
                    // Handle data channel messages
                };
                
                channel.onclose = () => {
                    console.log(`Data channel with ${targetId} closed`);
                };
                
                this.dataChannels.set(targetId, channel);
            }

            async initiateCall(callType = 'video', targetId = null) {
                if (!targetId) {
                    targetId = document.getElementById('dialInput').value.trim();
                    if (!targetId) {
                        this.showToast('Please enter a participant ID', 'error');
                        return;
                    }
                }

                if (this.isInCall) {
                    this.showToast('Already in a call', 'warning');
                    return;
                }

                try {
                    this.showToast(`Calling ${targetId}...`, 'info');
                    
                    const pc = await this.createPeerConnection(targetId, true);
                    
                    // Create and send offer
                    const offer = await pc.createOffer({
                        offerToReceiveAudio: true,
                        offerToReceiveVideo: callType === 'video'
                    });
                    
                    await pc.setLocalDescription(offer);
                    
                    // Send offer through signaling
                    await this.signaling.sendOffer(targetId, offer);
                    
                    this.isInCall = true;
                    this.showCallInterface();
                    this.observability.log('CALL', `Call initiated to ${targetId}`);
                    
                } catch (error) {
                    this.observability.error('CALL', 'Failed to initiate call', error);
                    this.showToast('Failed to start call', 'error');
                    this.peerConnections.delete(targetId);
                }
            }

            async handleOffer(from, offer) {
                if (this.isInCall) {
                    await this.signaling.sendCallRejected(from, 'busy');
                    return;
                }

                this.incomingCallData = { from, offer };
                this.showIncomingCallModal(from);
            }

            async acceptCall() {
                if (!this.incomingCallData) return;

                try {
                    const { from, offer } = this.incomingCallData;
                    
                    const pc = await this.createPeerConnection(from, false);
                    await pc.setRemoteDescription(offer);
                    
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    
                    await this.signaling.sendAnswer(from, answer);
                    
                    this.isInCall = true;
                    this.hideIncomingCallModal();
                    this.showCallInterface();
                    this.showToast('Call accepted!', 'success');
                    
                } catch (error) {
                    this.observability.error('CALL', 'Failed to accept call', error);
                    this.showToast('Failed to accept call', 'error');
                } finally {
                    this.incomingCallData = null;
                }
            }

            rejectCall() {
                if (!this.incomingCallData) return;

                this.signaling.sendCallRejected(this.incomingCallData.from, 'rejected');
                this.hideIncomingCallModal();
                this.incomingCallData = null;
                this.showToast('Call declined', 'info');
            }

            hangUp() {
                console.log('Hanging up call');
                
                // Send call-ended signal to all peers
                this.peerConnections.forEach((pc, targetId) => {
                    this.signaling.sendCallEnded(targetId);
                    this.removePeerConnection(targetId);
                });

                if (this.statsInterval) {
                    clearInterval(this.statsInterval);
                }

                this.isInCall = false;
                this.hideCallInterface();
                this.showToast('Call ended', 'info');
            }

            removePeerConnection(targetId) {
                const pc = this.peerConnections.get(targetId);
                if (pc) {
                    pc.close();
                    this.peerConnections.delete(targetId);
                }
                
                const dc = this.dataChannels.get(targetId);
                if (dc) {
                    dc.close();
                    this.dataChannels.delete(targetId);
                }
                
                // Remove remote video
                this.removeRemoteVideo(targetId);
            }

            addRemoteVideo(peerId, stream) {
                const videoGrid = document.getElementById('videoGrid');
                
                // Remove existing remote video if present
                this.removeRemoteVideo(peerId);

                const remoteParticipant = document.createElement('div');
                remoteParticipant.className = 'video-participant remote';
                remoteParticipant.id = `remote-${peerId}`;
                remoteParticipant.innerHTML = `
                    <video id="remote-video-${peerId}" autoplay playsinline></video>
                    <div class="participant-info">
                        <div class="participant-name">User ${peerId}</div>
                        <div class="connection-quality" id="connection-quality-${peerId}">Connecting...</div>
                    </div>
                `;

                videoGrid.appendChild(remoteParticipant);
                
                // Set the video source
                const remoteVideo = document.getElementById(`remote-video-${peerId}`);
                if (remoteVideo && stream) {
                    remoteVideo.srcObject = stream;
                }
            }

            removeRemoteVideo(peerId) {
                const remoteVideo = document.getElementById(`remote-${peerId}`);
                if (remoteVideo) {
                    remoteVideo.remove();
                }
            }

            // Media Control Methods
            toggleMic() {
                if (!this.localStream) return;
                
                const audioTrack = this.localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    const btn = document.getElementById('micBtn');
                    btn.classList.toggle('active', !audioTrack.enabled);
                    btn.innerHTML = audioTrack.enabled ? 
                        '<i class="fas fa-microphone"></i>' : 
                        '<i class="fas fa-microphone-slash"></i>';
                    
                    this.showToast(audioTrack.enabled ? 'Microphone on' : 'Microphone off', 'info', 2000);
                    this.observability.log('MEDIA', `Microphone ${audioTrack.enabled ? 'enabled' : 'disabled'}`);
                }
            }

            toggleVideo() {
                if (!this.localStream) return;
                
                const videoTrack = this.localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    const btn = document.getElementById('videoBtn');
                    btn.classList.toggle('active', !videoTrack.enabled);
                    btn.innerHTML = videoTrack.enabled ? 
                        '<i class="fas fa-video"></i>' : 
                        '<i class="fas fa-video-slash"></i>';
                    
                    this.showToast(videoTrack.enabled ? 'Camera on' : 'Camera off', 'info', 2000);
                    this.observability.log('MEDIA', `Camera ${videoTrack.enabled ? 'enabled' : 'disabled'}`);
                }
            }

            async toggleScreenShare() {
                if (!this.isSharingScreen) {
                    await this.startScreenShare();
                } else {
                    this.stopScreenShare();
                }
            }

            async startScreenShare() {
                try {
                    this.screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: 'always' },
                        audio: true
                    });
                    
                    this.isSharingScreen = true;
                    document.getElementById('screenShareBtn').classList.add('active');
                    
                    // Replace video track in all peer connections
                    const videoTrack = this.screenStream.getVideoTracks()[0];
                    this.peerConnections.forEach((pc, targetId) => {
                        const sender = pc.getSenders().find(s => 
                            s.track && s.track.kind === 'video'
                        );
                        if (sender) {
                            sender.replaceTrack(videoTrack);
                        }
                    });

                    this.screenStream.getTracks()[0].onended = () => this.stopScreenShare();
                    this.showToast('Screen sharing started', 'success');
                    this.observability.log('MEDIA', 'Screen sharing started');
                    
                } catch (error) {
                    this.observability.error('MEDIA', 'Failed to start screen share', error);
                    this.showToast('Failed to start screen sharing', 'error');
                }
            }

            stopScreenShare() {
                if (this.screenStream) {
                    this.screenStream.getTracks().forEach(track => track.stop());
                    this.screenStream = null;
                }
                
                this.isSharingScreen = false;
                document.getElementById('screenShareBtn').classList.remove('active');
                
                // Switch back to camera
                if (this.localStream) {
                    const videoTrack = this.localStream.getVideoTracks()[0];
                    this.peerConnections.forEach((pc, targetId) => {
                        const sender = pc.getSenders().find(s => 
                            s.track && s.track.kind === 'video'
                        );
                        if (sender && videoTrack) {
                            sender.replaceTrack(videoTrack);
                        }
                    });
                }
                this.showToast('Screen sharing stopped', 'info');
            }

            // UI Management Methods
            showApp() {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'block';
                
                if (this.currentUser) {
                    document.getElementById('userName').textContent = this.currentUser.username;
                    document.getElementById('userAvatar').textContent = this.currentUser.username.charAt(0).toUpperCase();
                    document.getElementById('displayUserName').textContent = this.currentUser.username;
                    document.getElementById('displayUserAvatar').textContent = this.currentUser.username.charAt(0).toUpperCase();
                    document.getElementById('userUniqueId').textContent = this.userUniqueId;
                    document.getElementById('displayUserId').textContent = this.userUniqueId;
                }
                
                this.startLocalStream();
                this.startStatsCollection();
            }

            showCallInterface() {
                document.getElementById('videoGrid').style.display = 'grid';
                this.updateCallStatus('connected');
            }

            hideCallInterface() {
                this.isInCall = false;
                document.getElementById('videoGrid').style.display = 'none';
                this.updateCallStatus('ready');
                
                // Clear all remote videos
                const videoGrid = document.getElementById('videoGrid');
                const remoteVideos = videoGrid.querySelectorAll('.video-participant:not(.local)');
                remoteVideos.forEach(video => video.remove());
            }

            showIncomingCallModal(from) {
                document.getElementById('callerInfo').textContent = `User ${from} is calling you...`;
                document.getElementById('incomingCallModal').style.display = 'flex';
                document.getElementById('overlay').style.display = 'block';
            }

            hideIncomingCallModal() {
                document.getElementById('incomingCallModal').style.display = 'none';
                document.getElementById('overlay').style.display = 'none';
            }

            toggleDialer() {
                const dialer = document.getElementById('dialerModal');
                if (dialer.style.display === 'flex') {
                    dialer.style.display = 'none';
                    document.getElementById('overlay').style.display = 'none';
                } else {
                    dialer.style.display = 'flex';
                    document.getElementById('overlay').style.display = 'block';
                }
            }

            closeDialer() {
                document.getElementById('dialerModal').style.display = 'none';
                document.getElementById('overlay').style.display = 'none';
            }

            toggleStats() {
                const statsPanel = document.querySelector('.stats-panel');
                if (statsPanel.style.display === 'none') {
                    statsPanel.style.display = 'block';
                } else {
                    statsPanel.style.display = 'none';
                }
            }

            // Stats and Monitoring
            startStatsCollection() {
                this.statsInterval = setInterval(() => {
                    this.updateConnectionStats();
                }, 2000);
            }

            updateConnectionStats() {
                const statsElement = document.getElementById('connectionStats');
                if (!statsElement) return;

                const stats = {
                    'Peer Connections': this.peerConnections.size,
                    'Data Channels': this.dataChannels.size,
                    'Local Stream': this.localStream ? 'Active' : 'Inactive',
                    'Screen Share': this.isSharingScreen ? 'Active' : 'Inactive',
                    'Call Status': this.isInCall ? 'In Call' : 'Ready'
                };

                statsElement.innerHTML = Object.entries(stats)
                    .map(([key, value]) => `
                        <div class="stats-row">
                            <span>${key}:</span>
                            <span>${value}</span>
                        </div>
                    `).join('');
            }

            startConnectionMonitoring(pc, targetId) {
                // Monitor connection quality
                setInterval(async () => {
                    if (pc.connectionState === 'connected') {
                        await this.updateConnectionQuality(pc, targetId);
                    }
                }, 5000);
            }

            async updateConnectionQuality(pc, targetId) {
                try {
                    const stats = await pc.getStats();
                    let packetsLost = 0;
                    let packetsReceived = 0;
                    
                    stats.forEach(report => {
                        if (report.type === 'inbound-rtp' && report.mediaType === 'video') {
                            packetsLost += report.packetsLost || 0;
                            packetsReceived += report.packetsReceived || 1;
                        }
                    });
                    
                    const lossRate = packetsLost / (packetsReceived + packetsLost);
                    let quality = 'excellent';
                    
                    if (lossRate > 0.1) quality = 'poor';
                    else if (lossRate > 0.05) quality = 'fair';
                    else if (lossRate > 0.02) quality = 'good';
                    
                    const qualityElement = document.getElementById(`connection-quality-${targetId}`);
                    if (qualityElement) {
                        qualityElement.textContent = quality.charAt(0).toUpperCase() + quality.slice(1);
                        qualityElement.className = `connection-quality quality-${quality}`;
                    }
                } catch (error) {
                    console.error('Error getting connection stats:', error);
                }
            }

            updateCallStatus(status) {
                // Update call status in UI if needed
                console.log('Call status:', status);
            }

            // Utility Methods
            generateUniqueId() {
                return Math.random().toString(36).substr(2, 9).toUpperCase();
            }

            showToast(message, type = 'info', duration = 5000) {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const icons = {
                    success: 'fas fa-check-circle',
                    error: 'fas fa-exclamation-circle',
                    warning: 'fas fa-exclamation-triangle',
                    info: 'fas fa-info-circle'
                };
                
                toast.innerHTML = `
                    <i class="${icons[type] || icons.info}"></i>
                    <span>${message}</span>
                `;
                
                document.getElementById('toastContainer').appendChild(toast);
                
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, duration);
            }

            copyUserId() {
                if (!this.userUniqueId) {
                    this.showToast('User ID not available', 'error');
                    return;
                }
                navigator.clipboard.writeText(this.userUniqueId).then(() => {
                    this.showToast('User ID copied to clipboard!', 'success');
                }).catch(() => {
                    this.showToast('Failed to copy user ID', 'error');
                });
            }

            // Placeholder methods for demo
            async simulateRegistration(username, email, password) {
                await new Promise(resolve => setTimeout(resolve, 1000));
                console.log('Registration simulation:', { username, email });
            }

            async simulateLogin(email, password) {
                await new Promise(resolve => setTimeout(resolve, 1000));
                console.log('Login simulation:', { email });
            }

            validateAuthInput(username, email, password) {
                if (!username || !email || !password) {
                    this.showToast('Please fill in all fields', 'error');
                    return false;
                }
                
                if (password.length < 6) {
                    this.showToast('Password must be at least 6 characters', 'error');
                    return false;
                }
                
                if (!this.isValidEmail(email)) {
                    this.showToast('Please enter a valid email address', 'error');
                    return false;
                }
                
                return true;
            }

            isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            // Session management
            saveUserSession(userData) {
                const sessionData = {
                    ...userData,
                    timestamp: Date.now()
                };
                localStorage.setItem('webrtc_session', JSON.stringify(sessionData));
            }

            getUserSession() {
                try {
                    return JSON.parse(localStorage.getItem('webrtc_session'));
                } catch {
                    return null;
                }
            }

            isSessionValid(session) {
                return session && (Date.now() - session.timestamp < 24 * 60 * 60 * 1000);
            }

            async restoreSession(session) {
                this.currentUser = session;
                this.userUniqueId = session.uniqueId;
                this.showApp();
                this.showToast('Session restored', 'success');
            }

            clearUserSession() {
                localStorage.removeItem('webrtc_session');
            }
        }

        // Signaling Service
        class SignalingService {
            constructor() {
                this.ws = null;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.messageQueue = [];
                this.isConnected = false;
            }

            async connect() {
                return new Promise((resolve, reject) => {
                    // In a real app, you'd connect to your WebSocket server
                    // For demo, we'll simulate connection
                    setTimeout(() => {
                        this.isConnected = true;
                        this.processMessageQueue();
                        resolve();
                    }, 500);
                });
            }

            async sendOffer(to, offer) {
                const message = { type: 'offer', to, offer };
                await this.sendMessage(message);
            }

            async sendAnswer(to, answer) {
                const message = { type: 'answer', to, answer };
                await this.sendMessage(message);
            }

            async sendIceCandidate(to, candidate) {
                const message = { type: 'ice-candidate', to, candidate };
                await this.sendMessage(message);
            }

            async sendCallRejected(to, reason) {
                const message = { type: 'call-rejected', to, reason };
                await this.sendMessage(message);
            }

            async sendCallEnded(to) {
                const message = { type: 'call-ended', to };
                await this.sendMessage(message);
            }

            async sendMessage(message) {
                if (!this.isConnected) {
                    this.messageQueue.push(message);
                    return;
                }

                // Simulate WebSocket send
                console.log('Signaling message sent:', message);
            }

            processMessageQueue() {
                while (this.messageQueue.length > 0) {
                    const message = this.messageQueue.shift();
                    this.sendMessage(message);
                }
            }

            disconnect() {
                this.isConnected = false;
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }
        }

        // Observability
        class Observability {
            constructor() {
                this.metrics = {
                    callsInitiated: 0,
                    callsReceived: 0,
                    callsConnected: 0,
                    callsFailed: 0,
                    mediaErrors: 0,
                    signalingErrors: 0
                };
            }

            initialize() {
                this.setupPerformanceMonitoring();
                this.setupErrorTracking();
            }

            log(category, message, data = null) {
                const timestamp = new Date().toISOString();
                console.log(`[${timestamp}] [${category}] ${message}`, data || '');
            }

            error(category, message, error) {
                this.metrics[`${category.toLowerCase()}Errors`]++;
                this.log(category, `ERROR: ${message}`, error);
            }

            metric(name, value) {
                this.metrics[name] = value;
            }

            setupPerformanceMonitoring() {
                if ('performance' in window) {
                    performance.mark('app-start');
                }
            }

            setupErrorTracking() {
                window.addEventListener('error', (event) => {
                    this.error('GLOBAL', 'Unhandled error', event.error);
                });

                window.addEventListener('unhandledrejection', (event) => {
                    this.error('PROMISE', 'Unhandled promise rejection', event.reason);
                });
            }

            getMetrics() {
                return { ...this.metrics };
            }
        }

        // Initialize the application
        const app = new WebRTCApp();
    </script>
</body>
