<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoCall Pro - Secure Video Calling</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Add all the previous CSS styles here */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .auth-form input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin: 10px 0;
        }

        .btn:hover {
            background: #5a6fd8;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .error-message {
            color: #e74c3c;
            background: #f8d7da;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }

        .success-message {
            color: #27ae60;
            background: #d4edda;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }

        /* Add the rest of your CSS styles from previous code */
    </style>
</head>

<body>
    <!-- Authentication Screens -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="logo">
                <i class="fas fa-video"></i> VideoCall Pro
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button class="btn" onclick="login()">Sign In</button>
                <button class="btn btn-secondary" onclick="showRegister()">Create Account</button>
                <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                    <p style="font-size: 14px; color: #666; margin-bottom: 10px;">
                        <strong>Demo Accounts:</strong>
                    </p>
                    <p style="font-size: 12px; color: #888;">
                        User 1: user1@test.com / pass123<br>
                        User 2: user2@test.com / pass123
                    </p>
                </div>
            </div>

            <div id="registerForm" class="auth-form" style="display: none;">
                <h2>Create Account</h2>
                <input type="text" id="registerUsername" placeholder="Username" required>
                <input type="email" id="registerEmail" placeholder="Email" required>
                <input type="password" id="registerPassword" placeholder="Password" required>
                <button class="btn" onclick="register()">Sign Up</button>
                <button class="btn btn-secondary" onclick="showLogin()">Back to Login</button>
            </div>

            <!-- Demo Mode Option -->
            <div id="demoMode" style="margin-top: 20px; text-align: center;">
                <button class="btn btn-success" onclick="enableDemoMode()">
                    <i class="fas fa-play-circle"></i> Try Demo Mode
                </button>
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="appScreen" class="container" style="display: none;">
        <div class="app-container">
            <div class="header">
                <div class="logo">
                    <i class="fas fa-video"></i> VideoCall Pro
                    <span id="demoBadge"
                        style="font-size: 12px; background: #28a745; color: white; padding: 2px 8px; border-radius: 10px; margin-left: 10px; display: none;">
                        DEMO MODE
                    </span>
                </div>
                <div class="user-info">
                    <div class="avatar" id="userAvatar">U</div>
                    <span id="userName">User</span>
                    <button class="btn btn-secondary" onclick="logout()" style="margin: 0 0 0 10px; padding: 8px 15px;">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="main-content">
                <!-- Users List -->
                <div class="users-panel">
                    <div class="users-list">
                        <h3><i class="fas fa-users"></i> Online Users</h3>
                        <div id="usersList">
                            <!-- Demo users will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- Video Call Interface -->
                <div class="call-interface">
                    <div class="video-container" id="videoContainer">
                        <div class="video-wrapper local">
                            <video id="localVideo" autoplay playsinline muted></video>
                            <div class="video-label">You</div>
                        </div>
                        <!-- Remote videos will be added here dynamically -->
                    </div>

                    <div class="controls">
                        <button class="control-btn" id="micBtn" onclick="toggleMic()">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button class="control-btn" id="videoBtn" onclick="toggleVideo()">
                            <i class="fas fa-video"></i>
                        </button>
                        <button class="control-btn" id="screenShareBtn" onclick="toggleScreenShare()">
                            <i class="fas fa-desktop"></i>
                        </button>
                        <button class="control-btn end-call" onclick="hangUp()">
                            <i class="fas fa-phone-slash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Incoming Call Notification -->
    <div id="incomingCallNotification" class="notification" style="display: none;">
        <h4>Incoming Call</h4>
        <p id="callerInfo">User is calling you...</p>
        <div class="notification-buttons">
            <button class="btn btn-success" onclick="acceptCall()">
                <i class="fas fa-phone"></i> Accept
            </button>
            <button class="btn btn-danger" onclick="rejectCall()">
                <i class="fas fa-phone-slash"></i> Decline
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-auth-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC4PF__jAZuPBZw6rqheI2gokZW-WtxwDg",
            authDomain: "video-call-1a584.firebaseapp.com",
            projectId: "video-call-1a584",
            storageBucket: "video-call-1a584.firebasestorage.app",
            messagingSenderId: "537253207694",
            appId: "1:537253207694:web:f8222f7a1a4d4c5f16f3df",
        };

        // Initialize Firebase
        let firebaseApp;
        let db;
        let auth;
        let isDemoMode = false;

        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            console.log("Firebase initialized successfully");
        } catch (error) {
            console.error("Firebase initialization error:", error);
            showError("Firebase configuration issue. Switching to demo mode.");
            enableDemoMode();
        }

        // Demo mode data
        const demoUsers = [
            { id: 'demo-user-1', username: 'John Doe', online: true },
            { id: 'demo-user-2', username: 'Jane Smith', online: true },
            { id: 'demo-user-3', username: 'Mike Johnson', online: false },
            { id: 'demo-user-4', username: 'Sarah Wilson', online: true }
        ];

        // Global variables
        let localStream, screenStream, peerConnections = {};
        let currentUser = null;
        let currentCall = null;
        let isInCall = false;
        let isSharingScreen = false;
        let incomingCallData = null;

        // DOM Elements
        const authScreen = document.getElementById('authScreen');
        const appScreen = document.getElementById('appScreen');
        const usersList = document.getElementById('usersList');
        const videoContainer = document.getElementById('videoContainer');
        const incomingCallNotification = document.getElementById('incomingCallNotification');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const demoBadge = document.getElementById('demoBadge');

        // Utility Functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';

            // Auto hide after 5 seconds
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';

            // Auto hide after 3 seconds
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        // Demo Mode Functions
        function enableDemoMode() {
            isDemoMode = true;
            demoBadge.style.display = 'inline-block';

            // Create a demo user
            currentUser = {
                uid: 'demo-user-' + Date.now(),
                username: 'Demo User',
                email: 'demo@example.com'
            };

            showApp();
            showSuccess("Demo mode activated! You can test video calls locally.");
        }

        function setupDemoUsers() {
            usersList.innerHTML = '';
            demoUsers.forEach(user => {
                if (user.id !== currentUser.uid) {
                    const userItem = document.createElement('div');
                    userItem.className = `user-item ${user.online ? 'online' : 'offline'}`;
                    userItem.innerHTML = `
                        <div class="avatar">${user.username.charAt(0).toUpperCase()}</div>
                        <div>
                            <div>${user.username}</div>
                            <small>${user.online ? 'Online' : 'Offline'}</small>
                        </div>
                        <div class="call-actions">
                            <button class="call-btn video-call" onclick="initiateDemoCall('${user.id}', '${user.username}', 'video')">
                                <i class="fas fa-video"></i>
                            </button>
                            <button class="call-btn audio-call" onclick="initiateDemoCall('${user.id}', '${user.username}', 'audio')">
                                <i class="fas fa-phone"></i>
                            </button>
                        </div>
                    `;
                    usersList.appendChild(userItem);
                }
            });
        }

        function initiateDemoCall(targetUserId, targetUsername, callType) {
            // Simulate incoming call after 2 seconds
            setTimeout(() => {
                document.getElementById('callerInfo').textContent = `${targetUsername} is ${callType === 'video' ? 'video' : 'audio'} calling you...`;
                incomingCallNotification.style.display = 'block';

                incomingCallData = {
                    id: 'demo-call-' + Date.now(),
                    from: targetUserId,
                    type: callType,
                    username: targetUsername
                };
            }, 2000);
        }

        // Authentication Functions
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            hideMessages();
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            hideMessages();
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            if (!username || !email || !password) {
                showError('Please fill in all fields');
                return;
            }

            try {
                if (isDemoMode) {
                    showError('Cannot register in demo mode. Please disable demo mode first.');
                    return;
                }

                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                await db.collection('users').doc(user.uid).set({
                    username: username,
                    email: email,
                    online: true,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });

                currentUser = {
                    uid: user.uid,
                    username: username,
                    email: email
                };

                showApp();
                showSuccess('Registration successful!');
            } catch (error) {
                console.error('Registration error:', error);

                if (error.code === 'auth/configuration-not-found') {
                    showError('Authentication not configured. Please enable demo mode or check Firebase configuration.');
                } else if (error.code === 'auth/email-already-in-use') {
                    showError('Email already registered. Please use a different email.');
                } else if (error.code === 'auth/weak-password') {
                    showError('Password is too weak. Please use a stronger password.');
                } else if (error.code === 'auth/invalid-email') {
                    showError('Invalid email address.');
                } else {
                    showError('Registration failed: ' + error.message);
                }
            }
        }

        async function login() {
            const email = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please enter both email and password');
                return;
            }

            // Demo accounts for testing
            if (email === 'user1@test.com' && password === 'pass123') {
                currentUser = {
                    uid: 'test-user-1',
                    username: 'Test User 1',
                    email: 'user1@test.com'
                };
                showApp();
                return;
            } else if (email === 'user2@test.com' && password === 'pass123') {
                currentUser = {
                    uid: 'test-user-2',
                    username: 'Test User 2',
                    email: 'user2@test.com'
                };
                showApp();
                return;
            }

            try {
                if (isDemoMode) {
                    showError('Cannot login in demo mode. Please disable demo mode first.');
                    return;
                }

                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!doc.exists) {
                    showError('User not found. Please register first.');
                    return;
                }

                currentUser = {
                    uid: user.uid,
                    username: userDoc.data().username,
                    email: user.email
                };

                // Update user status to online
                await db.collection('users').doc(user.uid).update({
                    online: true,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });

                showApp();
                showSuccess('Login successful!');
            } catch (error) {
                console.error('Login error:', error);

                if (error.code === 'auth/configuration-not-found') {
                    showError('Authentication not configured. Please use demo mode or check Firebase configuration.');
                } else if (error.code === 'auth/user-not-found') {
                    showError('User not found. Please check your email or register.');
                } else if (error.code === 'auth/wrong-password') {
                    showError('Incorrect password. Please try again.');
                } else if (error.code === 'auth/invalid-email') {
                    showError('Invalid email address.');
                } else {
                    showError('Login failed: ' + error.message);
                }
            }
        }

        function logout() {
            if (currentUser && !isDemoMode) {
                db.collection('users').doc(currentUser.uid).update({
                    online: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            if (auth) {
                auth.signOut();
            }

            currentUser = null;
            isDemoMode = false;
            authScreen.style.display = 'flex';
            appScreen.style.display = 'none';
            demoBadge.style.display = 'none';
            hideMessages();
        }

        function showApp() {
            authScreen.style.display = 'none';
            appScreen.style.display = 'block';
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();

            initializeApp();
        }

        // Initialize main application
        async function initializeApp() {
            await startLocalStream();

            if (isDemoMode) {
                setupDemoUsers();
            } else {
                setupUsersListener();
                setupCallsListener();
            }
        }

        // Media stream function (same as before)
        async function startLocalStream() {
            try {
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000,
                        channelCount: 2
                    }
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
            } catch (error) {
                console.error('Error accessing media devices:', error);
                showError('Camera and microphone access is required for video calls.');
            }
        }

        // Accept call function for demo mode
        async function acceptCall() {
            if (!incomingCallData) return;

            if (isDemoMode) {
                // Simulate successful call connection in demo mode
                incomingCallNotification.style.display = 'none';
                isInCall = true;
                showCallInterface();

                // Simulate remote video after 1 second
                setTimeout(() => {
                    simulateRemoteVideo();
                }, 1000);

                showSuccess(`Connected to ${incomingCallData.username}`);
            } else {
                // Your existing acceptCall logic for real mode
                await db.collection('calls').doc(incomingCallData.id).update({
                    status: 'active',
                    participants: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
                });

                incomingCallNotification.style.display = 'none';
                isInCall = true;
                showCallInterface();
                createPeerConnection(incomingCallData.id, true);
            }
        }

        function simulateRemoteVideo() {
            // Create a fake remote video stream
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const context = canvas.getContext('2d');

            // Create a gradient background
            const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Add text
            context.fillStyle = 'white';
            context.font = '30px Arial';
            context.textAlign = 'center';
            context.fillText('Remote User', canvas.width / 2, canvas.height / 2);

            // Convert to stream
            const stream = canvas.captureStream(30);
            addRemoteVideo('demo-remote', stream);
        }

        function rejectCall() {
            incomingCallNotification.style.display = 'none';
            incomingCallData = null;
        }

        // Add the rest of your existing functions (toggleMic, toggleVideo, hangUp, etc.)
        function toggleMic() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                const btn = document.getElementById('micBtn');
                btn.classList.toggle('active', !audioTrack.enabled);
                btn.innerHTML = audioTrack.enabled ?
                    '<i class="fas fa-microphone"></i>' :
                    '<i class="fas fa-microphone-slash"></i>';
            }
        }

        function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                const btn = document.getElementById('videoBtn');
                btn.classList.toggle('active', !videoTrack.enabled);
                btn.innerHTML = videoTrack.enabled ?
                    '<i class="fas fa-video"></i>' :
                    '<i class="fas fa-video-slash"></i>';
            }
        }

        function hangUp() {
            isInCall = false;
            currentCall = null;
            hideCallInterface();

            // Remove remote videos
            const remoteVideos = document.querySelectorAll('.video-wrapper.remote');
            remoteVideos.forEach(video => video.remove());

            showSuccess('Call ended');
        }

        function showCallInterface() {
            document.querySelector('.call-interface').style.display = 'flex';
            document.querySelector('.users-panel').style.display = 'none';
        }

        function hideCallInterface() {
            document.querySelector('.call-interface').style.display = 'none';
            document.querySelector('.users-panel').style.display = 'block';
        }

        function addRemoteVideo(peerId, stream) {
            const videoWrapper = document.createElement('div');
            videoWrapper.className = 'video-wrapper remote';
            videoWrapper.id = `remote-wrapper-${peerId}`;

            const video = document.createElement('video');
            video.id = `remote-${peerId}`;
            video.autoplay = true;
            video.playsinline = true;
            video.srcObject = stream;

            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = 'Remote User';

            videoWrapper.appendChild(video);
            videoWrapper.appendChild(label);
            videoContainer.appendChild(videoWrapper);
        }

        // Add screen share function
        async function toggleScreenShare() {
            if (!isSharingScreen) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: 'always' },
                        audio: true
                    });
                    isSharingScreen = true;
                    document.getElementById('screenShareBtn').classList.add('active');

                    screenStream.getTracks()[0].onended = stopScreenShare;
                    showSuccess('Screen sharing started');
                } catch (error) {
                    console.error('Screen share error:', error);
                    showError('Failed to start screen sharing');
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
            }
            isSharingScreen = false;
            document.getElementById('screenShareBtn').classList.remove('active');
            showSuccess('Screen sharing stopped');
        }

        // Add the remaining functions from your original code as needed
    </script>
</body>

</html>
